<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Fabric — Presentations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: rgba(255,255,255,0.08);
      --text: #f0f0f0;
      --muted: rgba(255,255,255,0.4);
      --accent: #c8a96e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 64px;
    }

    .wordmark {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .divider {
      width: 32px;
      height: 1px;
      background: var(--border);
      margin: 20px auto;
    }

    .headline {
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 200;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 860px;
    }

    .card {
      background: var(--surface);
      padding: 40px 36px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: background 0.2s;
    }

    .card:hover { background: #1c1c1c; }

    .card-index {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .card-title {
      font-size: 20px;
      font-weight: 300;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .card-desc {
      font-size: 13px;
      font-weight: 300;
      color: var(--muted);
      line-height: 1.6;
    }

    .card-cta {
      margin-top: 12px;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
    }

    footer {
      margin-top: 56px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <p class="wordmark">Studio Fabric</p>
    <div class="divider"></div>
    <h1 class="headline">Presentations</h1>
  </header>

  <nav class="grid" aria-label="Presentations">

    <a class="card" href="/living-images/">
      <span class="card-index">01</span>
      <h2 class="card-title">Living Images</h2>
      <p class="card-desc">The future of visual storytelling — AI-powered imagery tools for real estate marketing.</p>
      <span class="card-cta">View ›</span>
    </a>

    <a class="card" href="/menlopark/">
      <span class="card-index">02</span>
      <h2 class="card-title">Parkline Residences</h2>
      <p class="card-desc">Vision deck for a luxury rental concept in Menlo Park.</p>
      <span class="card-cta">View ›</span>
    </a>

  </nav>

  <footer>&copy; Studio Fabric</footer>

</body>
</html>
